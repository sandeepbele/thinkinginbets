[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkinginbets"
version = "0.1.0"
description = "Paper-first prediction-market trading research for soccer match markets."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Thinking in Bets" }]
dependencies = []

[project.optional-dependencies]
models = ["penaltyblog"]

[project.scripts]
thinkinginbets = "thinkinginbets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
